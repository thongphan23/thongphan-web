name = "thongphan-signup-api"
main = "workers/api/signup.ts"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

[vars]
DATA_PLATFORM_URL = "https://api.thongphan.com"

[observability]
enabled = false

[[routes]]
pattern = "thongphan.com/api/signup"
zone_name = "thongphan.com"

[[routes]]
pattern = "www.thongphan.com/api/signup"
zone_name = "thongphan.com"

[[kv_namespaces]]
binding = "KV"
id = "18e5b3dde1924e659dd536794f1d2ce2"
preview_id = "e676e1ad29844b24a18fb4c8241b6992"

[[ratelimits]]
name = "SIGNUP_IP_RATE_LIMITER"
namespace_id = "2026071201"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "SIGNUP_EMAIL_RATE_LIMITER"
namespace_id = "2026071202"

  [ratelimits.simple]
  limit = 2
  period = 60
