name = "thongphan-vid"
main = "workers/vid/index.ts"
compatibility_date = "2026-08-12"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[routes]]
pattern = "vid.thongphan.com/*"
zone_name = "thongphan.com"

[vars]
PAGES_ORIGIN = "https://2890c9f8.thongphan-com.pages.dev"
BUNNY_LIBRARY_ID = "726519"
BUNNY_CDN_HOST = "vz-1fb1e85d-0d0.b-cdn.net"

[[d1_databases]]
binding = "VID_DB"
database_name = "thongphan-vid"
database_id = "cfcb0914-6d71-4c3d-bd02-d7e1fe9d8997"
migrations_dir = "workers/vid/migrations"

[env.preview]
name = "thongphan-vid-preview"
workers_dev = true
preview_urls = true
routes = []

[env.preview.vars]
PAGES_ORIGIN = "https://2890c9f8.thongphan-com.pages.dev"
BUNNY_LIBRARY_ID = "726519"
BUNNY_CDN_HOST = "vz-1fb1e85d-0d0.b-cdn.net"

[[env.preview.d1_databases]]
binding = "VID_DB"
database_name = "thongphan-vid-preview"
database_id = "f7ef9fb7-0988-4bf5-a611-79beb61c9ef4"
migrations_dir = "workers/vid/migrations"
